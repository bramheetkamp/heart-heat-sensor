version: '3.9'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=dev_secret_change_me
      - DATABASE_PATH=/app/data/heartrate.db
      - APPLE_BUNDLE_ID=com.heartrate.app
    restart: unless-stopped
