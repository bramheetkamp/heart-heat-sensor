name: HeartRate

options:
  bundleIdPrefix: com.heartrate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""          # set your team ID here
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  HeartRate:
    type: application
    platform: iOS
    sources:
      - path: HeartRate
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: HealthKit.framework
      - target: PulseWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartrate.app
        INFOPLIST_FILE: HeartRate/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeartRate/HeartRate.entitlements
        TARGETED_DEVICE_FAMILY: "1"    # iPhone only
    # NOTE: Info.plist is hand-maintained (BLE usage strings, heartrate:// URL
    # scheme, background modes, ATS). Do NOT add an `info:` block here — that
    # makes XcodeGen regenerate and overwrite the curated file. INFOPLIST_FILE
    # above points the target at it directly.

  PulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PulseWidget
        excludes:
          - "**/*.md"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartrate.app.widget
        INFOPLIST_FILE: PulseWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PulseWidget/PulseWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks @executable_path/../../../PulseWidget.appex/Frameworks"

  HeartRateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeartRateTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heartrate.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HeartRate.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HeartRate"
    dependencies:
      - target: HeartRate
